<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>hy.rip</title>
<meta name="description" content="hy.rip. Join the Discord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
<style>
/* hy.rip landing page. One file, one link: the Discord.
Change the invite in the <a class="hero"> tag below. */
:root{--red:#e5001c;--ink:#0b0b0b;--white:#fff;--snap:cubic-bezier(.2,1.5,.35,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--white);font-family:"Archivo",system-ui,sans-serif;overflow:hidden;display:grid;place-items:center}

main{position:relative;z-index:2;width:min(92vw,760px);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vmin,28px);text-align:center;padding:16px 0}
main > .hero{animation:slam .5s var(--snap) both .1s}
@keyframes slam{from{opacity:0;transform:translateY(8vmin) rotate(-8deg) scale(.7)}}

.logo{background:var(--white);color:var(--ink);padding:.4em .7em .2em;font-size:clamp(22px,5vmin,44px);font-style:italic;font-weight:900;font-stretch:118%;text-transform:uppercase;line-height:1;rotate:-5deg}
.logo i{display:inline-block;width:.18em;height:.86em;background:var(--red);transform:skewX(-22deg);margin:0 .2em;vertical-align:-.06em}

/* the headline is the link, and the only thing that moves */
.hero{display:flex;flex-direction:column;align-items:center;color:var(--white);text-decoration:none;font-size:clamp(46px,15vmin,156px);line-height:1.08;rotate:-3deg;white-space:nowrap;transition:transform .22s var(--snap)}
.hero .row{display:block}
.hero:hover,.hero:focus-visible{transform:scale(1.07) rotate(-2deg)}
.hero:active{transform:scale(.96)}
.hero:focus-visible{outline:4px solid var(--white);outline-offset:12px}
.hero:hover .l.b,.hero:focus-visible .l.b{background:var(--white);color:var(--ink)}
.hero:hover .l.w,.hero:focus-visible .l.w{background:var(--ink);color:var(--white);box-shadow:0 0 0 .05em var(--white)}
.l{display:inline-block;transform:rotate(var(--r)) scale(var(--s));font-weight:900;animation:jit .6s step-end infinite;animation-delay:calc(var(--n)*-90ms)}
.l.b,.l.w{padding:.02em .12em 0;margin:0 .04em}
.l.b{background:var(--ink);color:var(--white);box-shadow:0 0 0 .05em var(--white)}
.l.w{background:var(--white);color:var(--ink)}
.l.sp{width:.32em}
@keyframes jit{0%{transform:rotate(var(--r)) scale(var(--s))}50%{transform:rotate(calc(var(--r)*-.7)) scale(var(--s)) translateY(-.04em)}}

.cue{display:inline-block;margin-top:.5em;background:var(--ink);color:var(--white);box-shadow:0 0 0 .5vmin var(--white);padding:.5em 1em .4em;
font-size:clamp(15px,2.6vmin,22px);font-style:italic;font-weight:900;font-stretch:120%;text-transform:uppercase;line-height:1;rotate:5deg;transition:background .1s,color .1s}
.cue b{color:var(--red)}
.hero:hover .cue,.hero:focus-visible .cue{background:var(--white);color:var(--ink);box-shadow:0 0 0 .5vmin var(--ink)}

.note{background:var(--white);color:var(--ink);padding:.35em .8em .25em;font-size:clamp(13px,1.9vmin,16px);font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.06em;rotate:-2deg}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<main>
<div class="logo">hy<i></i>rip</div>
<a class="hero" id="join" href="https://discord.gg/S5sNU9YDv" rel="noopener" aria-label="Join the Discord">Join the Discord</a>
<p class="note">Portal opening soon</p>
</main>

<script>
function rng(seed){let s=seed*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
/* cut-out lettering: every letter gets its own tilt, size, width and case */
function ransom(text,seed,box){const r=rng(seed);let n=0;
return [...text].map(ch=>{if(ch===" ")return'<span class="l sp"></span>';
const c=r()<.72||"lL".includes(ch)?ch.toUpperCase():ch.toLowerCase(),x=r(),cls=x<box/2?" b":x<box?" w":"";
const st=`--r:${(r()*14-7).toFixed(1)}deg;--s:${(.9+r()*.28).toFixed(2)};--n:${n++};font-stretch:${Math.round(70+r()*55)}%;font-style:${r()<.6?"italic":"normal"}`;
return `<span class="l${cls}" style="${st}">${c}</span>`}).join("")}
document.getElementById("join").innerHTML=`<span aria-hidden="true"><span class="row">${ransom("Join the",12,.4)}</span><span class="row">${ransom("Discord",29,.4)}</span></span><span class="cue" aria-hidden="true">Click to join <b>&raquo;</b></span>`;
</script>
</body>
</html>
