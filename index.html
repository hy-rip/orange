<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hy.rip</title>
<meta name="description" content="hy.rip. Join the Discord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
<style>
/* hy.rip landing page. One file, one link: the Discord.
   Change the invite in the <a class="hero"> tag below. */
:root{--red:#e5001c;--ink:#0b0b0b;--white:#fff;--snap:cubic-bezier(.2,1.5,.35,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--white);color:var(--white);font-family:"Archivo",system-ui,sans-serif;overflow:hidden;display:grid;place-items:center}

/* star tunnel: rings step by 1.3x and 4deg, the loop zooms exactly two rings */
.stars{position:fixed;inset:0;width:100%;height:100%}
.zoom{animation:zoom 6s linear infinite}
@keyframes zoom{0%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.14) rotate(2deg)}50%{transform:scale(1.3) rotate(4deg)}75%{transform:scale(1.482) rotate(6deg)}100%{transform:scale(1.69) rotate(8deg)}}

/* red burst behind the words */
.bw{position:fixed;left:50%;top:50%;width:125vmin;height:125vmin;margin:-62.5vmin 0 0 -62.5vmin;animation:pop .6s var(--snap) both .1s}
.burst{position:absolute;inset:0;animation:spin 90s linear infinite}
.burst i{position:absolute;inset:0;animation:boil .5s step-end infinite}
.burst .bk{background:var(--white);transform:translate(1.4vmin,1.6vmin) scale(1.03)}
.burst .rd{background:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}

main{position:relative;z-index:2;width:min(92vw,760px);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vmin,28px);text-align:center;padding:16px 0}
main > *{animation:slam .5s var(--snap) both}
main > :nth-child(1){animation-delay:.25s} main > :nth-child(2){animation-delay:.33s} main > :nth-child(3){animation-delay:.41s}
main > :nth-child(4){animation-delay:.49s} main > :nth-child(5){animation-delay:.57s}
@keyframes slam{from{opacity:0;transform:translateY(8vmin) rotate(-8deg) scale(.7)}}

.logo{background:var(--white);color:var(--ink);box-shadow:0 0 0 .6vmin var(--ink);padding:.4em .7em .2em;font-size:clamp(22px,5vmin,44px);font-style:italic;font-weight:900;font-stretch:118%;text-transform:uppercase;line-height:1;rotate:-5deg}
.logo i{display:inline-block;width:.18em;height:.86em;background:var(--red);transform:skewX(-22deg);margin:0 .2em;vertical-align:-.06em}

/* the headline is the link */
.hero{display:flex;flex-direction:column;align-items:center;color:var(--white);text-decoration:none;font-size:clamp(46px,15vmin,156px);line-height:1.08;rotate:-3deg;white-space:nowrap;transition:transform .22s var(--snap)}
.hero .row{display:block}
.hero:hover,.hero:focus-visible{transform:scale(1.07) rotate(-2deg)}
.hero:active{transform:scale(.96)}
.hero:focus-visible{outline:4px solid var(--white);outline-offset:12px}
.hero:hover .l.b,.hero:focus-visible .l.b{background:var(--white);color:var(--ink)}
.hero:hover .l.w,.hero:focus-visible .l.w{background:var(--ink);color:var(--white);box-shadow:0 0 0 .05em var(--white)}
.l{display:inline-block;transform:rotate(var(--r)) scale(var(--s));font-weight:900;animation:jit .6s step-end infinite;animation-delay:calc(var(--n)*-90ms);
text-shadow:.05em 0 #0b0b0b,-.05em 0 #0b0b0b,0 .05em #0b0b0b,0 -.05em #0b0b0b,.04em .04em #0b0b0b,-.04em .04em #0b0b0b,.04em -.04em #0b0b0b,-.04em -.04em #0b0b0b,.11em .11em 0 #0b0b0b}
.l.b,.l.w{text-shadow:none;padding:.02em .12em 0;margin:0 .04em}
.l.b{background:var(--ink);color:var(--white)}
.l.w{background:var(--white);color:var(--ink);box-shadow:0 0 0 .05em var(--ink)}
.l.sp{width:.32em}
@keyframes jit{0%{transform:rotate(var(--r)) scale(var(--s))}50%{transform:rotate(calc(var(--r)*-.7)) scale(var(--s)) translateY(-.04em)}}

.sub{background:var(--ink);padding:.6em 1em;font-size:clamp(15px,2.4vmin,20px);line-height:1.4;font-weight:600;max-width:34em;rotate:-1.5deg}

.cue{display:inline-block;margin-top:.5em;background:var(--ink);color:var(--white);box-shadow:0 0 0 .5vmin var(--white);padding:.5em 1em .4em;
font-size:clamp(15px,2.6vmin,22px);font-style:italic;font-weight:900;font-stretch:120%;text-transform:uppercase;line-height:1;rotate:5deg;transition:background .1s,color .1s}
.cue b{color:var(--red)}
.hero:hover .cue,.hero:focus-visible .cue{background:var(--white);color:var(--ink);box-shadow:0 0 0 .5vmin var(--ink)}

.note{background:var(--white);color:var(--ink);padding:.35em .8em .25em;font-size:clamp(13px,1.9vmin,16px);font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.06em;rotate:-2deg}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<svg class="stars" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g class="zoom" id="stars"></g></svg>
<div class="bw" aria-hidden="true"><div class="burst"><i class="bk"></i><i class="rd"></i></div></div>

<main>
<div class="logo">hy<i></i>rip</div>
<!-- The one link. Replace href with your real invite. -->
<a class="hero" id="join" href="https://discord.gg/YOUR-INVITE" rel="noopener" aria-label="Join the Discord">Join the Discord</a>
<p class="note">Portal opening soon</p>
</main>

<script>
function rng(seed){let s=seed*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
/* cut-out lettering: every letter gets its own tilt, size, width and case */
function ransom(text,seed,box){const r=rng(seed);let n=0;
return [...text].map(ch=>{if(ch===" ")return'<span class="l sp"></span>';
const c=r()<.72||"lL".includes(ch)?ch.toUpperCase():ch.toLowerCase(),x=r(),cls=x<box/2?" b":x<box?" w":"";
const st=`--r:${(r()*14-7).toFixed(1)}deg;--s:${(.9+r()*.28).toFixed(2)};--n:${n++};font-stretch:${Math.round(70+r()*55)}%;font-style:${r()<.6?"italic":"normal"}`;
return `<span class="l${cls}" style="${st}">${c}</span>`}).join("")}
document.getElementById("join").innerHTML=`<span aria-hidden="true"><span class="row">${ransom("Join the",12,.4)}</span><span class="row">${ransom("Discord",29,.4)}</span></span><span class="cue" aria-hidden="true">Click to join <b>&raquo;</b></span>`;

{let h="";
for(let i=27;i>=0;i--){const R=3*Math.pow(1.3,i),rot=(i*4-90)*Math.PI/180,p=[];
for(let k=0;k<10;k++){const a=rot+k*Math.PI/5,rr=k%2?R*.5:R;p.push((Math.cos(a)*rr).toFixed(1)+","+(Math.sin(a)*rr).toFixed(1))}
h+=`<polygon points="${p.join(" ")}" fill="${i%2?"#0b0b0b":"#fff"}"/>`}
document.getElementById("stars").innerHTML=h}

/* burst outline, three slightly different drawings so it boils */
function burstPath(seed,j){const r=rng(seed),r2=rng(seed*7+j),p=[],n=26;
for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rad=(i%2?30+r()*7:41+r()*9)+(r2()*2.4-1.2);
p.push(`${(50+Math.cos(a)*rad).toFixed(1)}% ${(50+Math.sin(a)*rad).toFixed(1)}%`)}
return `polygon(${p.join(",")})`}
{const st=document.createElement("style");
st.textContent=`@keyframes boil{0%{clip-path:${burstPath(5,1)}}33%{clip-path:${burstPath(5,2)}}66%{clip-path:${burstPath(5,3)}}}`;
document.head.appendChild(st)}
</script>
</body>
</html>
